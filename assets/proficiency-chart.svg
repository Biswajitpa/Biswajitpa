<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00E6BF"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#B084F5"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DD2476"/>
      <stop offset="100%" stop-color="#FF6A9E"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#FF8A5B"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="760" height="300" rx="10" fill="#0D1117"/>

  <!-- gridlines at 25/50/75/100% (bar area: x=230 to x=700, 470px = 100%) -->
  <g stroke="#21262D" stroke-width="1">
    <line x1="347" y1="14" x2="347" y2="266"/>
    <line x1="465" y1="14" x2="465" y2="266"/>
    <line x1="582" y1="14" x2="582" y2="266"/>
    <line x1="700" y1="14" x2="700" y2="266"/>
  </g>
  <g fill="#6E7681" font-size="11">
    <text x="347" y="281" text-anchor="middle">25%</text>
    <text x="465" y="281" text-anchor="middle">50%</text>
    <text x="582" y="281" text-anchor="middle">75%</text>
    <text x="700" y="281" text-anchor="middle">100%</text>
  </g>

  <!-- baseline -->
  <line x1="230" y1="14" x2="230" y2="266" stroke="#30363D" stroke-width="1.5"/>

  <!-- Row 1: C / C++ (DSA) - 85% -->
  <text x="220" y="38" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="end">C / C++ (DSA)</text>
  <rect x="230" y="26" width="399" height="20" rx="6" fill="url(#bar1)"/>
  <text x="639" y="41" fill="#E6EDF3" font-size="12" font-weight="700">85%</text>

  <!-- Row 2: Embedded Systems (IoT, CAN) - 80% -->
  <text x="220" y="88" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="end">Embedded Systems (IoT, CAN)</text>
  <rect x="230" y="76" width="376" height="20" rx="6" fill="url(#bar2)"/>
  <text x="616" y="91" fill="#E6EDF3" font-size="12" font-weight="700">80%</text>

  <!-- Row 3: MERN / Full Stack - 75% -->
  <text x="220" y="138" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="end">MERN / Full Stack</text>
  <rect x="230" y="126" width="353" height="20" rx="6" fill="url(#bar3)"/>
  <text x="593" y="141" fill="#E6EDF3" font-size="12" font-weight="700">75%</text>

  <!-- Row 4: AI / ML - 70% -->
  <text x="220" y="188" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="end">AI / ML</text>
  <rect x="230" y="176" width="329" height="20" rx="6" fill="url(#bar4)"/>
  <text x="569" y="191" fill="#E6EDF3" font-size="12" font-weight="700">70%</text>

  <!-- Row 5: Cloud & DevOps - 65% -->
  <text x="220" y="238" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="end">Cloud &amp; DevOps</text>
  <rect x="230" y="226" width="306" height="20" rx="6" fill="url(#bar5)"/>
  <text x="546" y="241" fill="#E6EDF3" font-size="12" font-weight="700">65%</text>
</svg>
